# Suite de escalado CNN para Exp. 05 (LODO binario multi-semilla) en A100/G4
defaults:
  task: exp05_lodo
  epochs: 30
  batch_size: 32
  amp_dtype: bf16
  arm: both
  seeds: [42, 123, 777]
  folds: ["Moondream Staged", "ACRIMA", "RIM-ONE DL", "EyePACS REAL"]
  weight_decay: 0.0001
  drop_path_rate: 0.15
  save_every: 5
  keep_checkpoints: true

jobs:
  # 1. Control directo de resolución y preentrenamiento IN-22K con ConvNeXt-Tiny
  - name: convnext_tiny_in22k_224_full_ft
    model_name: convnext_tiny.fb_in22k_ft_in1k
    img_size: 224
    ft_strategy: full_ft
    lp_epochs: 1
    lr: 0.0001

  - name: convnext_tiny_in22k_384_lp_ft
    model_name: convnext_tiny.fb_in22k_ft_in1k_384
    img_size: 384
    ft_strategy: lp_ft
    lp_epochs: 5
    head_lr: 0.001
    lr: 0.0001
    backbone_lr_mult: 0.1

  # 2. Escala de capacidad CNN moderna @384 px (LP-FT)
  - name: convnext_small_in22k_384_lp_ft
    model_name: convnext_small.fb_in22k_ft_in1k_384
    img_size: 384
    ft_strategy: lp_ft
    lp_epochs: 5
    head_lr: 0.001
    lr: 0.0001
    backbone_lr_mult: 0.1

  - name: convnext_base_in22k_384_lp_ft
    model_name: convnext_base.fb_in22k_ft_in1k_384
    img_size: 384
    batch_size: 24
    ft_strategy: lp_ft
    lp_epochs: 5
    head_lr: 0.001
    lr: 0.00008
    backbone_lr_mult: 0.1

  # 3. Familias CNN complementarias @384 px
  - name: resnet50d_384_lp_ft
    model_name: resnet50d
    img_size: 384
    ft_strategy: lp_ft
    lp_epochs: 5
    head_lr: 0.001
    lr: 0.0001
    backbone_lr_mult: 0.2

  - name: efficientnetv2_m_in21k_384_lp_ft
    model_name: tf_efficientnetv2_m.in21k_ft_in1k
    img_size: 384
    batch_size: 24
    ft_strategy: lp_ft
    lp_epochs: 5
    head_lr: 0.001
    lr: 0.0001
    backbone_lr_mult: 0.1
